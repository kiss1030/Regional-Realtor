<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional Realtor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e6f2ff;
            margin: 0;
            padding: 10px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        /* --- Setup Screen Styles --- */
        #setup-screen {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            max-width: 550px;
            margin: 30px auto;
            box-sizing: border-box;
            text-align: left;
        }
        #setup-screen h1 { text-align: center; }
        .form-group { margin: 18px 0; }
        label { font-weight: bold; display: block; margin-bottom: 6px; color: #34495e; }
        input[type="number"], input[type="text"], select {
            width: 100%; padding: 10px; font-size: 15px;
            box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;
        }
        .choice-btn {
            padding: 10px; margin: 5px 5px 5px 0; font-size: 14px; cursor: pointer;
            border: 2px solid #3498db; background-color: white; color: #3498db;
            border-radius: 6px; width: 48%; display: inline-block; text-align: center; box-sizing: border-box;
        }
        .choice-btn.selected { background-color: #3498db; color: white; }
        .qr-btn { background-color: #f39c12; color: white; border: none; width: 100%; margin-top: 10px; }
        #join-code-box {
            margin-top: 20px; padding: 15px; background-color: #f1f2f6;
            border: 2px dashed #2c3e50; border-radius: 6px; text-align: center;
        }
        #the-code { font-size: 24px; font-weight: bold; letter-spacing: 3px; color: #e74c3c; }
        
        .banker-box, .pawn-config-box {
            background: #f8f9fa; padding: 15px; border-radius: 6px;
            border: 1px solid #dee2e6; margin-top: 15px;
        }
        .player-pawn-row {
            display: flex; gap: 10px; margin-bottom: 8px; align-items: center;
        }
        .player-pawn-row span { font-weight: bold; width: 80px; font-size: 14px; }

        .start-btn {
            padding: 15px 30px; font-size: 18px; background-color: #27ae60;
            color: white; border: none; border-radius: 6px; cursor: pointer;
            margin-top: 20px; width: 100%;
        }
        .start-btn:hover { background-color: #2ecc71; }
        .start-btn:disabled { background-color: #95a5a6; cursor: not-allowed; }

        /* --- Game Board & UI Styles --- */
        #game-screen { display: none; }
        
        #scoreboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .player-score {
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 160px;
            text-align: left;
        }
        .player-title {
            font-size: 11px; font-weight: bold; color: #8e44ad;
            text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px;
        }
        .player-name { font-weight: bold; font-size: 15px; margin-bottom: 8px; color: #2c3e50; }
        .score-row {
            display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; color: #7f8c8d;
        }
        .score-row.main {
            font-size: 15px; font-weight: bold; color: #27ae60; 
            margin-bottom: 6px; border-bottom: 1px solid #ecf0f1; padding-bottom: 6px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            gap: 2px;
            background-color: #34495e; 
            border: 4px solid #34495e;
            width: 98vw;
            max-width: 1000px;
            aspect-ratio: 1; 
            margin: 10px auto;
        }
        
        .space {
            background-color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: space-evenly; font-size: 10px;
            font-weight: bold; text-align: center; padding: 5px; position: relative; overflow: hidden;
        }
        .property-img { width: 90%; height: 45px; object-fit: cover; border-radius: 3px; border: 1px solid #ccc; }
        .board-center {
            grid-column: 2 / 11; grid-row: 2 / 11; background-color: #e6f2ff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .board-center h2 { font-size: 38px; color: #2c3e50; text-transform: uppercase; letter-spacing: 3px; margin: 0; }
        .board-center h3 { margin: 5px 0 0 0; color: #7f8c8d; }
        
        /* Pawn Token Styles */
        .player-token {
            width: 22px; height: 22px; border-radius: 50%; position: absolute;
            transition: all 0.3s ease; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.6); 
            z-index: 10; display: flex; align-items: center; justify-content: center; font-size: 12px;
        }
        
        #turn-indicator {
            padding: 10px 20px; border-radius: 6px; color: white; font-weight: bold;
            display: inline-block; margin-bottom: 10px; font-size: 18px; text-align: center;
        }

        .audio-controls { margin-top: 10px; }
        .audio-btn {
            background-color: #7f8c8d; color: white; border: none; padding: 6px 14px;
            font-size: 13px; border-radius: 4px; cursor: pointer;
        }
        .audio-btn:hover { background-color: #606f7b; }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
        }
        #modal-box {
            background: white; padding: 25px; border-radius: 8px; max-width: 350px; width: 80%;
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #modal-box h3 { margin-top: 0; color: #2c3e50; }
        #modal-box p { font-size: 14px; color: #555; }
        .modal-btn {
            background: #3498db; color: white; border: none; padding: 10px 20px;
            font-size: 14px; border-radius: 6px; cursor: pointer; margin-top: 15px;
        }
        .modal-btn:hover { background: #2980b9; }
    </style>
</head>
<body>

    <audio id="bg-music" loop preload="auto">
        <source src="https://upload.wikimedia.org/wikipedia/commons/e/e3/Jazz_In_Paris.ogg" type="audio/ogg">
        Your browser does not support the audio element.
    </audio>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3 id="modal-title">Notice</h3>
            <p id="modal-text">Message goes here...</p>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <!-- SETUP SCREEN -->
    <div id="setup-screen">
        <h1>Welcome Realtors</h1>
        
        <div style="margin-bottom: 20px; text-align: center;">
            <button class="choice-btn selected" id="btn-host-mode" onclick="toggleMode('host')">Host Game</button>
            <button class="choice-btn" id="btn-join-mode" onclick="toggleMode('join')">Join Game</button>
        </div>

        <div id="host-ui">
            <!-- Board Edition Selector -->
            <div class="form-group">
                <label for="board-edition">Select Country / Board Edition</label>
                <select id="board-edition">
                    <option value="global">Global Edition (US / Standard)</option>
                    <option value="london">London Edition (UK)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="player-count">Total Users (2-8)</label>
                <input type="number" id="player-count" min="2" max="8" value="2" onchange="updatePlayerConfigOptions()">
            </div>
            
            <div class="form-group">
                <label>Who are you playing with?</label>
                <div>
                    <button class="choice-btn" id="btn-real" onclick="selectOpponent('real')">Real Players</button>
                    <button class="choice-btn selected" id="btn-ai" onclick="selectOpponent('ai')">AI / System</button>
                </div>
            </div>

            <!-- Player Pawns Configuration Box -->
            <div class="form-group pawn-config-box">
                <label>Configure Player Pawns & Icons</label>
                <div id="pawn-inputs-container">
                    <!-- Dynamically generated pawn options -->
                </div>
            </div>

            <div class="form-group banker-box">
                <label for="banker-select">Assign Banker</label>
                <select id="banker-select">
                    <option value="0">Player 1</option>
                    <option value="1">Player 2</option>
                </select>
                <label style="margin-top: 10px; font-weight: normal; cursor: pointer;">
                    <input type="checkbox" id="banker-plays" checked> 
                    The Banker will also play on the board
                </label>
            </div>

            <div id="join-code-box" style="display: none;">
                <p>Share this code to let others join:</p>
                <div id="the-code">------</div>
                <button class="choice-btn qr-btn" style="width:100%; margin:0;" onclick="alert('QR scanner coming soon!')">🔗 Generate QR Code</button>
            </div>

            <button class="start-btn" onclick="startGame('host')">Start Game</button>
        </div>

        <div id="join-ui" style="display: none;">
            <div class="form-group">
                <label for="join-code-input">Enter 6-Character Code:</label>
                <input type="text" id="join-code-input" placeholder="A1B2C3" maxlength="6" style="text-transform: uppercase;">
            </div>
            <p style="margin: 15px 0; font-weight: bold; text-align: center;">OR</p>
            <button class="choice-btn qr-btn" style="padding: 15px;" onclick="alert('Camera opening soon!')">📷 Scan QR Code</button>
            <button class="start-btn" onclick="startGame('join')">Join Session</button>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div id="scoreboard"></div>
        <div style="margin-bottom: 10px;">
            <div id="turn-indicator">Loading...</div><br>
            <button class="start-btn" id="btn-roll" style="width: auto; padding: 10px 20px;" onclick="processTurn()">🎲 Roll Dice</button>
            <p id="message" style="font-weight: bold; font-size: 16px;">Setting up game...</p>
            
            <div class="audio-controls">
                <button class="audio-btn" id="mute-btn" onclick="toggleMusic()">🔊 Mute Music</button>
            </div>
        </div>
        <div id="board">
            <div class="board-center">
                <h2 id="center-board-title">Regional<br>Realtor</h2>
                <h3 id="center-board-edition">Global Edition</h3>
            </div>
        </div>
    </div>

    <script>
        let isPlayingAI = true;
        const JAIL_FINE = 50;
        const availablePawns = ['🏎️', '🎩', '🐶', '🚢', '🐱', '👞', '🚗', '🚲'];
        const playerColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#34495e']; 

        // Dynamically build player pawn configuration rows and banker select options
        function updatePlayerConfigOptions() {
            let count = parseInt(document.getElementById('player-count').value);
            
            // Update Banker Select Options
            let bankerSelect = document.getElementById('banker-select');
            let currentBankerVal = bankerSelect.value;
            bankerSelect.innerHTML = '';
            
            // Update Pawn Inputs Container
            let pawnContainer = document.getElementById('pawn-inputs-container');
            pawnContainer.innerHTML = '';

            if(count >= 2 && count <= 8) {
                for(let i = 0; i < count; i++) {
                    // Banker option
                    let opt = document.createElement('option');
                    opt.value = i; 
                    opt.innerText = "Player " + (i + 1);
                    bankerSelect.appendChild(opt);

                    // Pawn row
                    let row = document.createElement('div');
                    row.className = 'player-pawn-row';
                    row.innerHTML = `
                        <span>Player ${i + 1}:</span>
                        <select id="pawn-select-${i}" style="flex:1;">
                            ${availablePawns.map((p, idx) => `<option value="${p}" ${idx === i ? 'selected' : ''}>Pawn ${p}</option>`).join('')}
                        </select>
                    `;
                    pawnContainer.appendChild(row);
                }
                if(currentBankerVal < count) bankerSelect.value = currentBankerVal;
            }
        }

        // Initialize setup options on load
        updatePlayerConfigOptions();

        function toggleMode(mode) {
            const hostUI = document.getElementById('host-ui'), joinUI = document.getElementById('join-ui');
            const btnHostMode = document.getElementById('btn-host-mode'), btnJoinMode = document.getElementById('btn-join-mode');
            if (mode === 'host') {
                hostUI.style.display = 'block'; joinUI.style.display = 'none';
                btnHostMode.classList.add('selected'); btnJoinMode.classList.remove('selected');
            } else {
                hostUI.style.display = 'none'; joinUI.style.display = 'block';
                btnJoinMode.classList.add('selected'); btnHostMode.classList.remove('selected');
            }
        }

        function selectOpponent(type) {
            const btnReal = document.getElementById('btn-real'), btnAi = document.getElementById('btn-ai'), joinBox = document.getElementById('join-code-box');
            if (type === 'real') {
                isPlayingAI = false; btnReal.classList.add('selected'); btnAi.classList.remove('selected');
                joinBox.style.display = 'block'; document.getElementById('the-code').innerText = "XYZ987"; 
            } else {
                isPlayingAI = true; btnAi.classList.add('selected'); btnReal.classList.remove('selected');
                joinBox.style.display = 'none';
            }
        }

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const muteBtn = document.getElementById('mute-btn');
            if (music.paused) {
                music.play();
                muteBtn.innerText = "🔊 Mute Music";
            } else {
                music.pause();
                muteBtn.innerText = "🔇 Play Music";
            }
        }

        // --- BOARD DATASETS ---
        const totalSpaces = 40; 
        const spaceNamesGlobal = [
            "START", "Vine St.", "Social Responsibility", "Coventry Ave.", "Income Tax", "Reading Railroad", "Oriental Ave.", "Try your luck", "Vermont Ave.", "Connecticut Ave.",
            "JAIL", "St. Charles Pl.", "Electric Co.", "States Ave.", "Virginia Ave.", "Penn. Railroad", "St. James Pl.", "Social Responsibility", "Tennessee Ave.", "New York Ave.",
            "FREE PARKING", "Kentucky Ave.", "Try your luck", "Indiana Ave.", "Illinois Ave.", "B. & O. Railroad", "Atlantic Ave.", "Ventnor Ave.", "Water Works", "Marvin Gardens",
            "GO TO JAIL", "Pacific Ave.", "North Carolina", "Social Responsibility", "Penn. Ave.", "Short Line RR", "Try your luck", "Park Place", "Luxury Tax", "Boardwalk"
        ];

        const spaceNamesLondon = [
            "GO", "Old Kent Road", "Social Responsibility", "Whitechapel Road", "Income Tax", "Kings Cross Stn", "The Angel Islington", "Try your luck", "Euston Road", "Pentonville Road",
            "JAIL", "Pall Mall", "Electric Co.", "Whitehall", "Northumberland", "Marylebone Stn", "Bow Street", "Social Responsibility", "Marlborough St", "Vine Street",
            "FREE PARKING", "Strand", "Try your luck", "Fleet Street", "Trafalgar Square", "Fenchurch St", "Leicester Square", "Coventry Street", "Water Works", "Piccadilly",
            "GO TO JAIL", "Regent Street", "Oxford Street", "Social Responsibility", "Bond Street", "Liverpool St", "Try your luck", "Park Lane", "Super Tax", "Mayfair"
        ];

        let spaceNames = spaceNamesGlobal;
        const nonPropertySpaces = [
            "START", "GO", "Social Responsibility", "Income Tax", "Try your luck", "JAIL", 
            "FREE PARKING", "GO TO JAIL", "Luxury Tax", "Super Tax"
        ];

        let players = [];
        let currentPlayerIndex = 0;

        function buildBoard() {
            const board = document.getElementById('board');
            board.innerHTML = `<div class="board-center"><h2 id="center-board-title">Regional<br>Realtor</h2><h3 id="center-board-edition">Edition</h3></div>`;

            for (let i = 0; i < totalSpaces; i++) {
                const spaceDiv = document.createElement('div');
                spaceDiv.className = 'space'; spaceDiv.id = 'space-' + i;
                
                const textSpan = document.createElement('span');
                textSpan.innerText = spaceNames[i]; spaceDiv.appendChild(textSpan);

                if (!nonPropertySpaces.includes(spaceNames[i])) {
                    const img = document.createElement('img');
                    img.className = 'property-img';
                    let cleanName = spaceNames[i].replace(/\s/g, '');
                    img.src = `https://picsum.photos/seed/${cleanName}/80/50`;
                    spaceDiv.appendChild(img);
                }

                let row, col;
                if (i >= 0 && i <= 10) { row = 11; col = 11 - i; } 
                else if (i >= 11 && i <= 20) { col = 1; row = 11 - (i - 10); } 
                else if (i >= 21 && i <= 30) { row = 1; col = i - 19; } 
                else { col = 11; row = i - 29; }
                spaceDiv.style.gridRow = row; spaceDiv.style.gridColumn = col;
                board.appendChild(spaceDiv);
            }
        }
        buildBoard();

        function startGame(action) {
            let numPlayers = 2; let bankerIndex = 0; let bankerPlays = true;

            // Get selected Board Edition
            let editionChoice = document.getElementById('board-edition').value;
            if (editionChoice === 'london') {
                spaceNames = spaceNamesLondon;
                document.getElementById('center-board-edition').innerText = "London Edition";
            } else {
                spaceNames = spaceNamesGlobal;
                document.getElementById('center-board-edition').innerText = "Global Edition";
            }
            buildBoard();

            if (action === 'host') {
                numPlayers = parseInt(document.getElementById('player-count').value);
                bankerIndex = parseInt(document.getElementById('banker-select').value);
                bankerPlays = document.getElementById('banker-plays').checked;
                
                let playingCount = numPlayers - (!bankerPlays ? 1 : 0);
                if (playingCount < 2) {
                    alert("You need at least 2 players on the board! Please increase total players or let the Banker play."); return;
                }
            } 

            const music = document.getElementById('bg-music');
            music.volume = 0.35;
            music.play().catch(error => { console.log("Audio play blocked by browser:", error); });

            let humanAssigned = false;
            players = [];

            for(let i = 0; i < numPlayers; i++) {
                let isBanker = (i === bankerIndex);
                let isPlaying = true;
                if(isBanker && !bankerPlays) isPlaying = false;

                let isAI = false;
                if (isPlayingAI) {
                    if (isPlaying && !humanAssigned) { isAI = false; humanAssigned = true; } 
                    else if (isPlaying) { isAI = true; }
                }

                // Get chosen pawn icon from dropdown
                let pawnIcon = document.getElementById(`pawn-select-${i}`) ? document.getElementById(`pawn-select-${i}`).value : availablePawns[i];

                players.push({
                    id: i, name: "Player " + (i + 1), color: playerColors[i], pawn: pawnIcon, position: 0,
                    isBanker: isBanker, isPlaying: isPlaying, isAI: isAI,
                    balance: 1500, netWorth: 1500, liquidity: 1500,
                    inJail: false, propertiesOwned: []
                });

                if (isPlaying) {
                    const token = document.createElement('div');
                    token.className = 'player-token'; token.id = 'token-' + i;
                    token.style.backgroundColor = playerColors[i];
                    token.innerHTML = pawnIcon;
                    token.style.marginLeft = (i * 6) + 'px'; token.style.marginTop = (i * 6) + 'px';
                    document.getElementById('space-0').appendChild(token);
                }
            }

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            updateScoreboard();
            updateTurnUI();
        }

        function updateScoreboard() {
            const scoreboard = document.getElementById('scoreboard');
            scoreboard.innerHTML = ''; 
            
            let totalGameWealth = 0;
            players.forEach(p => {
                if(p.isPlaying) {
                    p.netWorth = p.balance; 
                    p.liquidity = p.balance; 
                    totalGameWealth += p.netWorth;
                }
            });

            players.forEach(player => {
                if(player.isPlaying) {
                    let wealthPercentage = totalGameWealth > 0 ? (player.netWorth / totalGameWealth) * 100 : 0;
                    let title = "Trainee";
                    if (wealthPercentage >= 80) title = "Tycoon 👑";
                    else if (wealthPercentage >= 60) title = "Magnate";
                    else if (wealthPercentage >= 40) title = "Investor";
                    else if (wealthPercentage >= 20) title = "Realtor";

                    const scoreDiv = document.createElement('div');
                    scoreDiv.className = 'player-score';
                    scoreDiv.style.borderLeft = `8px solid ${player.color}`;
                    
                    let bankerIcon = player.isBanker ? ' 🏦' : '';
                    
                    scoreDiv.innerHTML = `
                        <span class="player-title" style="color: ${player.color}">${title}</span>
                        <div class="player-name">${player.pawn} ${player.name}${bankerIcon}</div>
                        <div class="score-row main"><span>Cash:</span> <span>£${player.balance}</span></div>
                        <div class="score-row"><span>Net Worth:</span> <span>£${player.netWorth}</span></div>
                        <div class="score-row"><span>Liquidity:</span> <span>£${player.liquidity}</span></div>
                    `;
                    scoreboard.appendChild(scoreDiv);
                }
            });
        }

        function updateTurnUI() {
            let currentPlayer = players[currentPlayerIndex];

            if (!currentPlayer.isPlaying) {
                currentPlayerIndex++;
                if (currentPlayerIndex >= players.length) currentPlayerIndex = 0;
                updateTurnUI(); 
                return;
            }

            const indicator = document.getElementById('turn-indicator');
            const rollBtn = document.getElementById('btn-roll');
            const msg = document.getElementById('message');
            
            let bankerTag = currentPlayer.isBanker ? " (Banker)" : "";
            indicator.innerText = `${currentPlayer.pawn} ${currentPlayer.name}${bankerTag}'s Turn`;
            indicator.style.backgroundColor = currentPlayer.color;

            if (currentPlayer.isAI) {
                rollBtn.disabled = true; 
                rollBtn.innerText = "🤖 AI is rolling...";
                msg.innerText = `${currentPlayer.name} is picking up the dice...`;
                
                setTimeout(() => { processTurn(); }, 1500); 
            } else {
                rollBtn.disabled = false;
                rollBtn.innerText = "🎲 Roll Dice";
                msg.innerText = "It's your turn!";
            }
        }

        function showModal(title, text, callback) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-text').innerText = text;
            document.getElementById('modal-overlay').style.display = 'flex';
            window.modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        function processTurn() {
            const p = players[currentPlayerIndex];

            if (p.inJail) {
                if (p.isAI) {
                    p.balance -= JAIL_FINE;
                    p.inJail = false;
                    updateScoreboard();
                    
                    showModal("Detention Escape", `${p.name} paid the £${JAIL_FINE} fine to escape detention! Rolling now...`, () => {
                        executeRoll(p);
                    });
                    return;
                } else {
                    showModal("Detention", "You are in Detention. Pay £50 fine to escape.", () => {
                        p.balance -= JAIL_FINE;
                        p.inJail = false;
                        updateScoreboard();
                        executeRoll(p);
                    });
                    return;
                }
            }

            executeRoll(p);
        }

        function executeRoll(p) {
            const roll1 = Math.floor(Math.random() * 6) + 1;
            const roll2 = Math.floor(Math.random() * 6) + 1; 
            const totalRoll = roll1 + roll2;
            
            p.position += totalRoll;
            
            if (p.position >= totalSpaces) {
                p.position -= totalSpaces;
                p.balance += 200; 
                updateScoreboard(); 
            }

            if (p.position === 30) {
                p.position = 10; 
                p.inJail = true;
                document.getElementById('message').innerText = `${p.name} was sent to Detention!`;
            } else {
                const spaceName = spaceNames[p.position];
                document.getElementById('message').innerText = `${p.name} rolled ${totalRoll} and landed on ${spaceName}.`;
            }

            const targetSpace = document.getElementById('space-' + p.position);
            const tokenToMove = document.getElementById('token-' + p.id);
            targetSpace.appendChild(tokenToMove);

            currentPlayerIndex++;
            if (currentPlayerIndex >= players.length) {
                currentPlayerIndex = 0;
            }

            updateTurnUI();
        }
    </script>
</body>
</html>
